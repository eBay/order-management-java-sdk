mutation ProcessReturnRefund($input: ProcessReturnRefundInput!) {
  processReturnRefund(input: $input) {
    __typename
    ... on OrderReturn {
      returnId
      status {
        __typename
        code
        displayText
        ... on ReturnRequested {
          code
          displayText
        }
        ... on ReturnOpen {
          code
          displayText
        }
        ... on ReturnDeclined {
          code
          displayText
        }
        ... on ReturnCancelled {
          code
          displayText
        }
        ... on ReturnClosed {
          code
          displayText
        }
      }
    }
    ... on ReturnNotFoundError {
      errorCode
      errorMessage
      requestedReturnId
    }
    ... on ReturnActionNotPermittedError {
      errorCode
      errorMessage
      availableActions {
        code
        displayText
      }
    }
    ... on ReturnLineItemNotFoundError {
      errorCode
      errorMessage
      requestedLineItemIds
    }
    ... on MultipleRefundWithholdingsNotAllowedError {
      errorCode
      errorMessage
      maxAllowed
      providedCount
    }
    ... on ProcessReturnRefundInputValidationError {
      errorCode
      errorMessage
      violations {
        __typename
        code
        displayMessage
        ... on ItemPriceRefundWithholdViolation {
          code
          displayMessage
          constraint {
            allowedPercentageRange {
              minValue
              maxValue
            }
          }
        }
        ... on ShippingPriceRefundWithholdViolation {
          code
          displayMessage
        }
      }
    }
    ... on RefundProcessingError {
      errorCode
      errorMessage
    }
    ... on RefundInstrumentInvalidError {
      errorCode
      errorMessage
    }
    ... on RefundInstrumentInsufficientFundsError {
      errorCode
      errorMessage
    }
    ... on RefundInstrumentDeclinedError {
      errorCode
      errorMessage
    }
    ... on RefundBlockedByPaymentDisputeError {
      errorCode
      errorMessage
    }
    ... on RefundAuthorizationFailedError {
      errorCode
      errorMessage
    }
  }
}
