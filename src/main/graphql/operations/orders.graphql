query Orders($input: OrdersInput!) {
  orders {
    sellerOrders(input: $input) {
      orders {
        orderId
        placedAt
        updatedAt
        logistics {
          fulfillmentPlan {
            planType
            logisticsPlanSteps {
              methodName {
                id
                displayName
              }
            }
          }
        }
        orderState {
          __typename
          ... on OrderAbandoned {
            label
            abandonedAt
            reason
          }
          ... on OrderCancelled {
            label
            cancelledAt
            reason
          }
          ... on OrderConfirmed {
            label
            fundingState {
              __typename
              ... on PaymentsCompleted {
                label
              }
              ... on PaymentsFailure {
                label
              }
              ... on PaymentsInProgress {
                label
              }
              ... on PaymentsNotStarted {
                label
              }
            }
            confirmedAt
          }
          ... on OrderPlaced {
            label
          }
        }
      }
      pagination {
        nextCursor
        previousCursor
      }
    }
  }
}
