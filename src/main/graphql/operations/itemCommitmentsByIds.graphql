query ItemCommitmentsByIds($input: ItemCommitmentsByIdsInput!) {
  itemCommitmentsByIds(input: $input) {
    __typename
    ... on ItemCommitmentsByIdsSuccess {
      itemCommitments {
        itemCommitmentId
        createdAt
        updatedAt
        state {
          __typename
          ... on ItemCommitmentActive {
            label
            fundingState {
              __typename
              ... on PaymentsNotStarted {
                label
              }
              ... on PaymentsInProgress {
                label
              }
              ... on PaymentsCompleted {
                label
              }
              ... on PaymentsFailure {
                label
              }
            }
            fulfillmentState {
              __typename
              ... on FulfillmentNotStarted {
                label
              }
              ... on FulfillmentInProgress {
                label
                startedAt
              }
              ... on FulfillmentCompleted {
                label
                completedAt
              }
            }
            cancelState {
              __typename
              ... on ContractCancelRequested {
                label
                requestedAt
              }
              ... on ContractCancelRejected {
                label
                rejectedAt
                reason
              }
              ... on ContractCancelPending {
                label
                startedAt
              }
              ... on ContractCancelCompleted {
                label
                completedAt
                refundOutcome
              }
            }
            returnState {
              __typename
              ... on ItemCommitmentReturnRequested {
                label
              }
              ... on ItemCommitmentReturnClosed {
                label
              }
            }
          }
          ... on ItemCommitmentCancelled {
            label
            cancelledAt
            reason
            cancelState {
              __typename
              ... on ContractCancelRequested {
                label
                requestedAt
              }
              ... on ContractCancelRejected {
                label
                rejectedAt
                reason
              }
              ... on ContractCancelPending {
                label
                startedAt
              }
              ... on ContractCancelCompleted {
                label
                completedAt
                refundOutcome
              }
            }
          }
          ... on ItemCommitmentLocked {
            label
          }
          ... on ItemCommitmentCompleted {
            label
          }
          ... on ItemCommitmentAbandoned {
            label
          }
        }
      }
    }
    ... on ItemCommitmentsByIdsPartialFailure {
      itemCommitments {
        itemCommitmentId
        createdAt
        updatedAt
      }
      failures {
        errorCode
        displayMessage
        inputItemCommitmentId
        retryable
      }
      errorCode
      errorMessage
    }
    ... on ItemCommitmentsByIdsCompleteFailure {
      failures {
        errorCode
        displayMessage
        inputItemCommitmentId
        retryable
      }
      errorCode
      errorMessage
    }
  }
}
