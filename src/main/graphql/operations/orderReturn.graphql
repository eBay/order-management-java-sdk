query OrderReturn($input: OrderReturnInput!, $scenario: ExchangeAmountScenario!) {
  orderReturn(input: $input) {
    __typename
    ... on OrderReturn {
      returnId
      requester
      requestedAt
      closedAt
      status {
        __typename
        code
        displayText
        ... on ReturnRequested {
          code
          displayText
        }
        ... on ReturnOpen {
          code
          displayText
        }
        ... on ReturnDeclined {
          code
          displayText
        }
        ... on ReturnCancelled {
          code
          displayText
        }
        ... on ReturnClosed {
          code
          displayText
        }
      }
      returnLineItems {
        returnLineItemId
        requestedQuantity
        returnReason {
          code
          displayText
        }
        returnNote
        orderLineItem {
          orderLineItemId
        }
        listingRestockTasks {
          __typename
          ... on PostPurchaseListingRelistTask {
            relistStatus {
              code
              displayText
            }
            relistedListing {
              __typename
              listingId
              ... on ListingReference {
                listingId
              }
            }
          }
        }
      }
      returnNegotiation {
        latestReturnOffer {
          status {
            __typename
            code
            displayText
            ... on ReturnOfferPending {
              code
              displayText
            }
            ... on ReturnOfferAccepted {
              code
              displayText
            }
            ... on ReturnOfferDeclined {
              code
              displayText
            }
            ... on ReturnOfferExpired {
              code
              displayText
            }
          }
          proposedTerm {
            __typename
            ... on KeepItemPartialRefundTerm {
              refundAmount {
                original {
                  value
                  currency
                }
                exchangeScenario(scenario: $scenario) {
                  __typename
                  ... on ExchangeAmount {
                    amount {
                      value
                      currency
                    }
                    exchangeRate
                    exchangeAt
                  }
                  ... on InvalidExchangeScenarioInputError {
                    errorCode
                    errorMessage
                  }
                }
              }
              itemPriceRefundPercentage
              itemShippingPriceWaived
              returnLineItem {
                returnLineItemId
                requestedQuantity
                returnReason {
                  code
                  displayText
                }
                returnNote
                orderLineItem {
                  orderLineItemId
                }
              }
            }
          }
        }
      }
    }
    ... on ReturnNotFoundError {
      errorCode
      errorMessage
      requestedReturnId
    }
  }
}
