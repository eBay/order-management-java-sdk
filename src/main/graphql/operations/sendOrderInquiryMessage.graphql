mutation SendOrderInquiryMessage($input: SendOrderInquiryMessageInput!) {
  sendOrderInquiryMessage(input: $input) {
    __typename
    ... on SendOrderInquiryMessageSuccess {
      orderInquiry {
        __typename
        closedAt
        createdAt
        initiator
        inquirers
        inquiryId
        providedInformation {
          submittedAt
          submittedInformation {
            __typename
            ... on OrderInquiryShipmentTracking {
              shippingCarrier {
                carrierCode
                unsupportedCarrierName
              }
              trackingNumber
            }
            ... on OrderInquirySignatureConfirmation {
              signatureConfirmationProof {
                documentId
                documentName
                filenameExtension
                uploadedAt
              }
              trackingNumber
            }
          }
          submitter
        }
        requestedInformation {
          requestedAt
          requester
        }
        responder
        status {
          code
          displayText
        }
        ... on ItemNotReceivedInquiry {
          inquiryId
          status {
            __typename
            ... on OrderInquiryOpen {
              code
              displayText
            }
            ... on OrderInquiryClosed {
              code
              displayText
            }
          }
          createdAt
          closedAt
          initiator
          responder
          inquirers
          lineItems {
            inquiryLineItemId
            quantity
            orderLineItem {
              orderLineItemId
            }
          }
          sellerAvailableActions {
            respondByAction {
              respondAction {
                code
                displayText
              }
              responseDueAt
            }
            secondaryActions {
              code
              displayText
            }
          }
          requestedInformation {
            __typename
            ... on ShipmentTrackingInformationRequested {
              requester
              requestedAt
            }
            ... on SignatureConfirmationRequested {
              requester
              requestedAt
            }
          }
          providedInformation {
            submitter
            submittedAt
            submittedInformation {
              __typename
              ... on OrderInquiryShipmentTracking {
                trackingNumber
                shippingCarrier {
                  carrierCode
                  unsupportedCarrierName
                }
              }
              ... on OrderInquirySignatureConfirmation {
                trackingNumber
                signatureConfirmationProof {
                  documentId
                  filenameExtension
                  documentName
                  uploadedAt
                }
              }
            }
          }
          cases {
            caseId
            status {
              __typename
              ... on PostPurchaseCaseOpen {
                code
                displayText
              }
              ... on PostPurchaseCaseClosed {
                code
                displayText
              }
            }
            reason {
              code
              displayText
            }
          }
          refunds {
            refundId
          }
        }
      }
    }
    ... on OrderInquiryNotFoundError {
      errorCode
      errorMessage
      inquiryId
    }
    ... on OrderInquiryActionNotPermittedError {
      errorCode
      errorMessage
      availableActions {
        code
        displayText
      }
    }
    ... on SendOrderInquiryMessageInputValidationError {
      errorCode
      errorMessage
      violations {
        code
        displayMessage
      }
    }
  }
}
