query ContractCancellation($input: ContractCancellationInput!) {
  contractCancellation(input: $input) {
    __typename
    ... on ContractCancellationSuccess {
      contractCancellation {
        cancellationId
        lineItems {
          __typename
          cancellationLineItemId
          requestedQuantity
          cancelledQuantity
          listingRestockTasks {
            __typename
            ... on PostPurchaseListingRelistTask {
              relistStatus {
                code
                displayText
              }
              relistedListing {
                listingId
              }
            }
          }
          ... on OrderCancellationLineItem {
            orderLineItem {
              orderLineItemId
            }
          }
        }
        requestedAt
        reason {
          code
          displayText
        }
        requesterNote
        requester
        status {
          code
          displayText
        }
        closedAt
        refunds {
          refundId
        }
        sellerAvailableActions {
          primaryActions {
            code
            displayText
          }
          responseDueAt
        }
      }
    }
    ... on ContractCancellationNotFoundError {
      errorCode
      errorMessage
      requestedContractCancellationId
    }
  }
}
