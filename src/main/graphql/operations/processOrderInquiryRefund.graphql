mutation ProcessOrderInquiryRefund($input: ProcessOrderInquiryRefundInput!) {
  processOrderInquiryRefund(input: $input) {
    __typename
    ... on ProcessOrderInquiryRefundSuccess {
      orderInquiry {
        __typename
        ... on ItemNotReceivedInquiry {
          inquiryId
          status {
            __typename
            ... on OrderInquiryOpen {
              code
              displayText
            }
            ... on OrderInquiryClosed {
              code
              displayText
            }
          }
          createdAt
          closedAt
          initiator
          responder
          inquirers
          lineItems {
            inquiryLineItemId
            quantity
            orderLineItem {
              orderLineItemId
            }
          }
          sellerAvailableActions {
            respondByAction {
              respondAction {
                code
                displayText
              }
              responseDueAt
            }
            secondaryActions {
              code
              displayText
            }
          }
          refunds {
            refundId
          }
        }
      }
    }
    ... on OrderInquiryActionNotPermittedError {
      errorCode
      errorMessage
      availableActions {
        code
        displayText
      }
    }
    ... on OrderInquiryNotFoundError {
      errorCode
      errorMessage
      inquiryId
    }
    ... on RefundAuthorizationFailedError {
      errorCode
      errorMessage
    }
    ... on RefundBlockedByPaymentDisputeError {
      errorCode
      errorMessage
    }
    ... on RefundInstrumentDeclinedError {
      errorCode
      errorMessage
    }
    ... on RefundInstrumentInsufficientFundsError {
      errorCode
      errorMessage
    }
    ... on RefundInstrumentInvalidError {
      errorCode
      errorMessage
    }
    ... on RefundProcessingError {
      errorCode
      errorMessage
    }
  }
}
