mutation UpdateSellerRmaPreference($input: UpdateSellerRmaPreferenceInput!) {
  updateSellerRmaPreference(input: $input) {
    __typename
    ... on SellerReturnPreferences {
      listingMarketplace
      rmaPreference {
        preferenceStatus
      }
    }
    ... on ReturnPreferenceNotFoundError {
      errorCode
      errorMessage
    }
  }
}
